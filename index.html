<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>SafeBangla</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy2:#1B4079;--red:#D62839;--green:#0E7A4B;--gold:#F5B83D;--bg:#EEF2F9;--card:#fff;--tx:#14213A;--mu:#5E6B82;--ln:#E3E8F0;--sh:0 6px 20px rgba(11,31,58,.08);--tip:#FFF1F2}
[data-theme=dark]{--bg:#0A1424;--card:#13233B;--tx:#EAF0FA;--mu:#9FB0C9;--ln:#223555;--sh:0 6px 20px rgba(0,0,0,.35);--tip:#1B2D4A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:linear-gradient(180deg,#DCE6F7,var(--bg) 340px) fixed,var(--bg);color:var(--tx);font-size:15px;padding-top:env(safe-area-inset-top)}
[data-theme=dark] body{background:var(--bg)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:6;background:linear-gradient(135deg,#0B1F3A,#1B4079);color:#fff;padding:10px 16px 15px;display:flex;align-items:center;gap:10px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(11,31,58,.25)}
header b{font-size:18px;display:block;line-height:1.1}header small{opacity:.75;font-size:11.5px}
.logo{width:42px;height:42px;border-radius:13px;flex:none;object-fit:cover;display:block;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.logo.big{width:104px;height:104px;border-radius:30px;margin:0 auto;box-shadow:0 16px 36px rgba(0,0,0,.4)}
#main{flex:1;padding:14px 14px calc(116px + env(safe-area-inset-bottom))}
h2{position:relative;padding-left:12px;font-size:18px;margin:20px 2px 10px;color:var(--navy)}[data-theme=dark] h2{color:#fff}
h2::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:4px;background:linear-gradient(var(--red),var(--gold))}
.card{background:var(--card);border-radius:20px;padding:13px 15px;margin-bottom:11px;box-shadow:var(--sh)}
.card h3{margin:0 0 2px;font-size:15.5px}.card p,.mu{margin:2px 0;color:var(--mu);font-size:13px}
.cardrow{display:flex;gap:10px;align-items:center}.cardrow>div:not(.ic):not(.ph){flex:1;min-width:0}
.cardrow>.btn,.cardrow>a.btn{flex:none;white-space:nowrap;min-width:84px}
.card.cardrow b{font-size:17px;color:var(--red);letter-spacing:.3px}
.ic{font-size:26px;flex:none;width:50px;height:50px;border-radius:16px;background:var(--bg);display:grid;place-items:center}
.btn{background:linear-gradient(135deg,#FF5A6B,#D62839);color:#fff;border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:600;min-height:44px;cursor:pointer;box-shadow:0 6px 14px rgba(214,40,57,.28)}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln);box-shadow:none}.btn.n{background:linear-gradient(135deg,#0B1F3A,#234E94);box-shadow:0 6px 14px rgba(11,31,58,.3)}.btn.s{padding:8px 12px;min-height:40px;font-size:13px}
.btn.out{background:none;color:var(--red);border:1.5px solid var(--red);box-shadow:none;border-radius:16px;height:52px}.wide{width:100%;margin-top:10px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>.btn{flex:1}
.brand{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fff,#F3F7FF);border-radius:28px;padding:14px 16px;box-shadow:0 14px 34px rgba(11,31,58,.16);border:1px solid rgba(27,64,121,.08)}
[data-theme=dark] .brand{background:linear-gradient(135deg,#16294A,#13233B);border-color:#223555}
.brand .logo{width:92px;height:92px;border-radius:26px;box-shadow:0 10px 24px rgba(11,31,58,.25)}
.brand h1{margin:0;font-size:29px;line-height:1.05;color:var(--navy);font-weight:700}[data-theme=dark] .brand h1{color:#fff}.brand h1 i{font-style:normal;color:var(--red)}
.brand p{margin:4px 0 0;color:var(--green);font-weight:600;font-size:14px}[data-theme=dark] .brand p{color:#3DD598}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0B1F3A 0%,#1B4079 60%,#2C62B8 100%);color:#fff;border-radius:24px;padding:14px 16px;margin-top:12px;box-shadow:0 10px 26px rgba(11,31,58,.28)}
.hero::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,61,.35),transparent 70%)}.hero>*{position:relative}
.av{width:54px;height:54px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:none;border:2px solid var(--gold)}
.hg{flex:1;min-width:0}.hg small{display:block;opacity:.8}.hg .dt{opacity:.7;font-size:12px}.hg h3{margin:1px 0;font-size:20px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px}.stat.on{background:rgba(48,200,120,.3)}
.sos{width:172px;height:172px;border-radius:50%;border:0;margin:30px auto 26px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ff7a88,var(--red) 60%,#a51525);color:#fff;font:inherit;font-size:33px;font-weight:700;box-shadow:0 0 0 14px rgba(214,40,57,.14),0 0 0 28px rgba(214,40,57,.07),0 12px 30px rgba(214,40,57,.45);cursor:pointer;animation:pulse 2.4s infinite}
.sos small{display:block;font-size:13px;font-weight:400}
@keyframes pulse{50%{transform:scale(1.04)}}@media(prefers-reduced-motion:reduce){.sos{animation:none}}
.quick{display:flex;gap:10px}.q{flex:1;text-align:center;color:#fff;border-radius:18px;padding:12px 4px;text-decoration:none;font-weight:700;box-shadow:0 8px 18px rgba(11,31,58,.18)}.q span{display:block;font-size:22px}
.q:nth-child(1){background:linear-gradient(135deg,#FF5A6B,#C41E30)}.q:nth-child(2){background:linear-gradient(135deg,#FF9A3D,#E0661A)}.q:nth-child(3){background:linear-gradient(135deg,#2FBF8B,#13805C)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:0;border-radius:22px;padding:14px 4px;text-align:center;font:inherit;font-size:12.5px;font-weight:600;color:var(--tx);min-height:98px;cursor:pointer;box-shadow:var(--sh)}
.tile span{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;margin:0 auto 6px;font-size:26px}
.tile:nth-child(3n+1) span{background:#FFE9EB}.tile:nth-child(3n+2) span{background:#E6EEFF}.tile:nth-child(3n) span{background:#E2F6EA}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);margin-top:4px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);border-color:transparent}
.frm label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}.frm .chk{display:flex;gap:8px;align-items:center}.frm .chk input{width:20px;margin:0}
.iw{position:relative;margin-top:6px}.iw input{margin:0;padding:15px 44px 15px 46px;height:54px;background:var(--bg);border:1.5px solid transparent;border-radius:16px}.iw input:focus{background:var(--card);border-color:var(--navy2);outline:0;box-shadow:0 0 0 4px rgba(27,64,121,.12)}
.ii{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:10px;cursor:pointer;opacity:.7}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(5,12,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.badge{background:var(--red);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:rgba(214,40,57,.1);color:var(--red);font-weight:600}
.warn{background:#FFF4E5;color:#7A4300;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;z-index:30;max-width:90%}
ul.l{padding-left:18px;margin:4px 0}ul.l li{margin:3px 0}.dont li::marker{color:var(--red)}
.ann{border-left:4px solid var(--red)}
.sec{display:flex;align-items:center;justify-content:space-between}.lnk{border:0;background:none;color:var(--red);font:inherit;font-weight:600;cursor:pointer;padding:6px}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.tipc{flex:none;width:78%;scroll-snap-align:start;background:var(--tip);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.nc{flex:none;width:74%;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:14px;border-top:3px solid var(--red);box-shadow:var(--sh);cursor:pointer}.nc h3{margin:8px 0 4px;font-size:15.5px;line-height:1.35}.nc p{margin:0;color:var(--mu);font-size:13px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.npaper{background:linear-gradient(135deg,#0B1F3A,#234E94);color:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 10px 26px rgba(11,31,58,.25)}.npaper small{opacity:.8}.npaper h2{padding:0}.npaper h2::before{display:none}
.nfeat{margin:12px 0;background:linear-gradient(135deg,#D62839,#8E1B2A);color:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 28px rgba(214,40,57,.35);cursor:pointer}.nfeat h3{margin:10px 0 6px;font-size:19px;line-height:1.35}.nfeat p{margin:0 0 8px;opacity:.9;font-size:14px}.nfeat .tag{background:rgba(255,255,255,.22);color:#fff}.nfeat small{opacity:.8}
.ncard{cursor:pointer}.ncard h3{font-size:15px;line-height:1.35}.nth{width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none}.nimg{width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-bottom:10px}
/* profile */
.phero{position:relative;overflow:hidden;text-align:center;background:linear-gradient(150deg,#081830,#1B4079 65%,#2C62B8);color:#fff;border-radius:30px;padding:28px 16px 40px;box-shadow:0 14px 32px rgba(11,31,58,.32)}
.phero::before{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,61,.4),transparent 70%)}
.phero::after{content:"";position:absolute;left:-60px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(214,40,57,.4),transparent 70%)}.phero>*{position:relative;z-index:1}
.avw{position:relative;display:inline-block;cursor:pointer;padding:4px;border-radius:50%;background:conic-gradient(var(--gold),#FF5A6B,var(--gold))}.av.big{width:96px;height:96px;font-size:44px;margin:0 auto;border:3px solid #0B1F3A}
.cam{position:absolute;right:-2px;bottom:-2px;background:var(--red);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:15px;border:2px solid #fff}
.phero h3{margin:10px 0 2px;font-size:22px}.phero p{margin:0;opacity:.8;font-size:13px}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}.chip{background:rgba(255,255,255,.14);border:1px solid rgba(245,184,61,.5);padding:4px 12px;border-radius:20px;font-size:12.5px}
.prog{height:7px;background:rgba(255,255,255,.18);border-radius:8px;margin:16px 10px 6px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF8A5B);border-radius:8px}.pct{opacity:.85;font-size:12px}
.stats{display:flex;gap:10px;margin:-22px 8px 0;position:relative;z-index:2}.st{flex:1;background:var(--card);border-radius:20px;padding:14px 4px;text-align:center;box-shadow:0 10px 24px rgba(11,31,58,.14)}.st b{display:block;font-size:22px;color:var(--navy)}[data-theme=dark] .st b{color:#fff}.st small{color:var(--mu);font-size:12px}
.card.lg{padding:4px 14px}.lr{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}.lr:last-child{border:0}.lr.tap{cursor:pointer}
.li{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.lr:nth-child(4n+1) .li{background:#E6EEFF}.lr:nth-child(4n+2) .li{background:#E2F6EA}.lr:nth-child(4n+3) .li{background:#FFF1D6}.lr:nth-child(4n) .li{background:#FFE9EB}
.lt{flex:1;min-width:0}.lt b{display:block;font-size:12.5px;color:var(--mu);font-weight:600}.lt small{display:block;font-size:15px;color:var(--tx);font-weight:600;word-break:break-all}
.lr.tap .lt b{font-size:15px;color:var(--tx)}.ch{color:var(--mu);font-size:22px}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px;font:inherit;color:var(--tx);cursor:pointer}.seg button.on{background:var(--navy);color:#fff}
/* nav dock */
#nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;height:68px;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;background:linear-gradient(135deg,rgba(14,37,71,.97),rgba(26,63,120,.97));backdrop-filter:blur(16px);border-radius:34px;box-shadow:0 16px 34px rgba(5,12,25,.42),inset 0 1px 0 rgba(255,255,255,.12);z-index:10}
.ni{position:relative;border:0;background:none;color:#8FA4C6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;padding:0;font:inherit;cursor:pointer;min-width:0;transition:color .25s}
.ni .nic{display:grid;place-items:center;width:44px;height:32px;border-radius:14px;transition:all .25s}.ni .nic .ico{display:inline-flex}
.ni .nlb{font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.ni.on{color:#fff}.ni.on .nic{background:linear-gradient(135deg,#FF5A6B,#D62839);box-shadow:0 7px 16px rgba(214,40,57,.55);transform:translateY(-4px)}
.nfab{justify-self:center;width:64px;height:64px;margin-top:-34px;border-radius:50%;border:0;color:#fff;font:inherit;font-size:16px;font-weight:700;letter-spacing:.5px;background:radial-gradient(circle at 35% 28%,#FF7A88,#D62839 62%,#A51525);box-shadow:0 0 0 6px #0F2547,0 12px 24px rgba(214,40,57,.6);cursor:pointer;display:grid;place-items:center;animation:pulse 2.4s infinite}
.nfab:active{transform:scale(.95)}
/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column}
.ahero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:54px 20px 86px;border-radius:0 0 38px 38px;background:linear-gradient(160deg,#081830,#1B4079 62%,#3A2F6B)}
.ahero::before,.ahero::after{content:"";position:absolute;border-radius:50%}
.ahero::before{width:220px;height:220px;right:-70px;top:-60px;background:radial-gradient(circle,rgba(245,184,61,.35),transparent 70%)}
.ahero::after{width:200px;height:200px;left:-80px;bottom:-60px;background:radial-gradient(circle,rgba(214,40,57,.45),transparent 70%)}.ahero>*{position:relative}
.ahero h1{margin:14px 0 4px;font-size:32px}.ahero p{margin:0;opacity:.85}
.feat{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.feat span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:12.5px}
.acard{background:var(--card);margin:-46px 16px 28px;padding:24px 18px;border-radius:28px;box-shadow:0 18px 44px rgba(11,31,58,.22)}.acard h2{font-size:22px;padding:0}.acard h2::before{display:none}
.acard .btn[type=submit]{width:100%;height:54px;border-radius:16px;font-size:16px}
.sosl{display:block;text-align:center;margin-top:16px;padding:12px;color:var(--red);font-weight:700;text-decoration:none;border:1.5px dashed rgba(214,40,57,.5);border-radius:14px}

/* ===== premium refresh ===== */
.brand{gap:12px;padding:10px 14px;border-radius:24px}
.brand .logo{width:58px;height:58px;border-radius:17px;box-shadow:0 8px 18px rgba(11,31,58,.22)}
.brand h1{font-size:24px}.brand p{font-size:13px;margin-top:2px}
.card{border:1px solid rgba(27,64,121,.06)}[data-theme=dark] .card{border-color:#223555}
.tile{border:1px solid rgba(27,64,121,.06);transition:transform .15s}.tile:active{transform:scale(.96)}
.tabs button.on{background:linear-gradient(135deg,#0B1F3A,#234E94);box-shadow:0 6px 14px rgba(11,31,58,.3)}
.phero{padding:30px 16px 50px;border-radius:34px;border:1px solid rgba(245,184,61,.25)}
.avw{padding:5px;box-shadow:0 0 0 6px rgba(245,184,61,.12),0 14px 34px rgba(0,0,0,.4)}
.av.big{width:104px;height:104px;font-size:44px;border:4px solid #0B1F3A}
.bgbadge{position:absolute;left:-6px;bottom:2px;min-width:36px;height:36px;padding:0 6px;border-radius:50%;background:linear-gradient(135deg,#FF5A6B,#D62839);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 6px 14px rgba(214,40,57,.5)}
.phero h3{font-size:25px;margin:14px 0 2px;letter-spacing:.2px}.phero p{font-size:13.5px}
.chip{background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:1px solid rgba(245,184,61,.55);padding:5px 13px}
.prog{height:8px;margin:18px 14px 8px}.prog i{box-shadow:0 0 12px rgba(245,184,61,.7)}
.stats{gap:12px;margin:-26px 12px 0}
.st{border-radius:22px;padding:16px 4px;border:1px solid rgba(27,64,121,.06);border-top:3px solid var(--gold)}
.st:nth-child(1){border-top-color:var(--red)}.st:nth-child(3){border-top-color:#2FBF8B}
.st b{font-size:24px}
.card.lg{padding:4px 16px;border-radius:24px}
.lr{padding:14px 0}.lr.tap:active{opacity:.6}
.li{width:42px;height:42px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(27,64,121,.06)}
.lt small{font-size:15.5px}

/* ===== premium login ===== */
#main.authm{padding:0 0 28px}
.ahero{padding:32px 20px 78px;border-radius:0 0 42px 42px;box-shadow:0 16px 36px rgba(8,24,48,.3)}
.ahero .logo.big{width:78px;height:78px;border-radius:24px;box-shadow:0 0 0 3px rgba(245,184,61,.9),0 0 0 10px rgba(245,184,61,.14),0 16px 32px rgba(0,0,0,.45)}
.ahero h1{font-size:30px;margin:18px 0 3px;letter-spacing:.3px}.ahero p{font-size:14px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.feat span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 2px;border-radius:16px;font-size:12px;line-height:1.2;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.feat span i{font-style:normal;font-size:21px}
.acard{position:relative;z-index:3;margin:-40px 16px 0;padding:24px 18px 16px;border-radius:30px;box-shadow:0 22px 50px rgba(11,31,58,.22);border:1px solid rgba(27,64,121,.06)}
.acard h2{font-size:23px;color:var(--navy)}[data-theme=dark] .acard h2{color:#fff}
.acard .frm label{font-weight:600}
.acard .btn[type=submit]{height:56px;border-radius:18px;margin-top:8px;font-size:16.5px;box-shadow:0 12px 24px rgba(214,40,57,.35)}
.acard .btn.g{background:none;border:0;box-shadow:none;color:var(--navy2);font-weight:600;margin-top:6px!important}[data-theme=dark] .acard .btn.g{color:#8DB4F2}
.sosl{background:rgba(214,40,57,.07);border:1px solid rgba(214,40,57,.25);border-radius:16px;margin-top:8px}
</style>
</head>
<body>
<div id="app"><header><span id="hl"></span><div><b>SafeBangla</b><small id="tag"></small></div></header><div id="main"></div><div id="nav" role="navigation"></div></div>
